apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visionflow-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
    - host: visionflow-staging.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visionflow-api
                port:
                  number: 8000
