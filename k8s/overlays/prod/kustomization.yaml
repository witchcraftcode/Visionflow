apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: visionflow-prod
resources:
  - ../../base
  - ingress.yaml
commonLabels:
  environment: prod
replicas:
  - name: visionflow-api
    count: 3
  - name: visionflow-worker
    count: 2
images:
  - name: visionflow-api
    newName: ghcr.io/witchcraftcode/visionflow-api
    newTag: latest
  - name: visionflow-worker
    newName: ghcr.io/witchcraftcode/visionflow-worker
    newTag: latest
