apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visionflow-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visionflow-allow-api-and-worker
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - visionflow-api
          - visionflow-worker
          - redis
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - visionflow-api
                  - visionflow-worker
                  - redis
  policyTypes:
    - Ingress
