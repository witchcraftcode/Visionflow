apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: visionflow-allow-ingress-controller
spec:
  podSelector:
    matchLabels:
      app: visionflow-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
