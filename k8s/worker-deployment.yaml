apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visionflow-worker
  template:
    metadata:
      labels:
        app: visionflow-worker
    spec:
      containers:
        - name: worker
          image: visionflow-worker
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: JOB_TTL_SECONDS
              value: "86400"
