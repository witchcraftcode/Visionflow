apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionflow-worker
  namespace: visionflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: visionflow-worker

  template:
    metadata:
      labels:
        app: visionflow-worker

    spec:
      containers:
        - name: worker
          image: 320698389216.dkr.ecr.ap-southeast-2.amazonaws.com/visionflow-worker:latest
          imagePullPolicy: Always

          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"