apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionflow-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visionflow-api
  template:
    metadata:
      labels:
        app: visionflow-api
    spec:
      containers:
        - name: api
          image: visionflow-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
