apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: visionflow-prod
  region: us-east-1

managedNodeGroups:
  - name: visionflow-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: false
    iam:
      withAddonPolicies:
        albIngress: true
        autoScaler: true

iam:
  withOIDC: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: metrics-server
