name: VisionFlow Production Deploy

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Configure SSH
        shell: bash
        run: |
            set -x

            mkdir -p ~/.ssh

            echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            ssh-keygen -l -f ~/.ssh/id_ed25519

            echo "HOST=${{ secrets.EC2_HOST }}"
            echo "USER=${{ secrets.EC2_USER }}"

            ssh-keyscan -v -H ${{ secrets.EC2_HOST }} 2>&1 | tee -a ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/Visionflow && ./scripts/deploy.sh"