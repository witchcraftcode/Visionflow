events {}

http {
    upstream visionflow_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name 3-27-17-39.nip.io;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 3-27-17-39.nip.io;

        ssl_certificate /etc/letsencrypt/live/3-27-17-39.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/3-27-17-39.nip.io/privkey.pem;

        client_max_body_size 10M;

        location / {
            proxy_pass http://visionflow_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://visionflow_api/health;
        }

        location /metrics {
            proxy_pass http://visionflow_api/metrics;
        }
    }
}